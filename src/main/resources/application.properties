server.port=${PORT:8790}
server.address=${BIND_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=${HTTP_THREADS:128}
server.tomcat.threads.min-spare=8
server.tomcat.max-connections=${HTTP_CONNECTIONS:4096}
server.tomcat.accept-count=128
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-keep-alive-requests=100
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/reservation;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=15000}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:24}
spring.datasource.hikari.minimum-idle=${DB_POOL_IDLE:4}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jdbc.template.query-timeout=8s
spring.transaction.default-timeout=15s
spring.task.scheduling.pool.size=2
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
app.admission.requests=${MAX_ACTIVE_REQUESTS:96}
app.admission.writes=${MAX_ACTIVE_WRITES:16}
app.admission.logins=${MAX_ACTIVE_LOGINS:2}
app.admission.sessions=${MAX_ACTIVE_SESSIONS:8}
app.admission.bulk=${MAX_ACTIVE_IMPORTS:1}
spring.flyway.enabled=true
spring.jackson.time-zone=Asia/Shanghai
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
app.mode=${APP_MODE:local}
app.data-dir=${APP_DATA_DIR:./data}
app.jwt-secret=${JWT_SECRET:}
app.admin-password=${ADMIN_PASSWORD:}
app.wechat.app-id=${WECHAT_APP_ID:}
app.wechat.secret=${WECHAT_APP_SECRET:}
app.wechat.message-token=${WECHAT_MESSAGE_TOKEN:}
app.wechat.message-aes-key=${WECHAT_MESSAGE_AES_KEY:}
app.wechat.message-allow-plaintext=${WECHAT_MESSAGE_ALLOW_PLAINTEXT:false}
app.wechat.service-app-id=${SERVICE_APP_ID:}
app.wechat.service-secret=${SERVICE_APP_SECRET:}
app.wechat.service-template=${SERVICE_TEMPLATE_ID:}
app.wechat.service-template-mapping=${SERVICE_TEMPLATE_MAPPING:}
app.wechat.oauth-url=${SERVICE_OAUTH_URL:}
app.wechat.customer-template=${CUSTOMER_TEMPLATE_ID:}
app.wechat.customer-reminder-template=${CUSTOMER_REMINDER_TEMPLATE_ID:}
app.wechat.customer-template-mapping=${CUSTOMER_TEMPLATE_MAPPING:}
app.wechat.customer-reminder-template-mapping=${CUSTOMER_REMINDER_TEMPLATE_MAPPING:}
app.pms.enabled=${PMS_ENABLED:false}
app.pms.key=${PMS_API_KEY:}
app.public-url=${PUBLIC_URL:}
app.sms.secret-id=${SMS_SECRET_ID:}
app.sms.secret-key=${SMS_SECRET_KEY:}
app.sms.app-id=${SMS_APP_ID:}
app.sms.sign-name=${SMS_SIGN_NAME:}
app.sms.staff-template=${SMS_STAFF_TEMPLATE_ID:}
app.sms.customer-template=${SMS_CUSTOMER_TEMPLATE_ID:}
app.sms.region=${SMS_REGION:ap-guangzhou}
app.sms.staff-params=${SMS_STAFF_PARAMS:storeName,time,eventLabel}
app.sms.customer-params=${SMS_CUSTOMER_PARAMS:storeName,time,status}
