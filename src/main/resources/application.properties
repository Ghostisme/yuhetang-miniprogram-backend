server.port=${PORT:8790}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/reservation;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=15000}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.time-zone=Asia/Shanghai
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
app.mode=${APP_MODE:local}
app.data-dir=${APP_DATA_DIR:./data}
app.jwt-secret=${JWT_SECRET:}
app.admin-password=${ADMIN_PASSWORD:}
app.wechat.app-id=${WECHAT_APP_ID:}
app.wechat.secret=${WECHAT_APP_SECRET:}
app.wechat.service-app-id=${SERVICE_APP_ID:}
app.wechat.service-secret=${SERVICE_APP_SECRET:}
app.wechat.service-template=${SERVICE_TEMPLATE_ID:}
app.wechat.oauth-url=${SERVICE_OAUTH_URL:}
app.wechat.customer-template=${CUSTOMER_TEMPLATE_ID:}
app.pms.enabled=${PMS_ENABLED:false}
app.pms.key=${PMS_API_KEY:}
app.public-url=${PUBLIC_URL:}
