# Activate explicitly with SPRING_PROFILES_ACTIVE=production.
app.mode=production
server.address=${BIND_ADDRESS:0.0.0.0}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=256
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=10000
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=5
management.server.port=${MANAGEMENT_PORT:9001}
management.server.address=${MANAGEMENT_BIND_ADDRESS:0.0.0.0}
management.endpoints.web.exposure.include=health,prometheus
# Management endpoints must remain inside the private deployment network or loopback.
server.forward-headers-strategy=native
# Only the deployment network's proxies may provide the client address. The API port must remain private.
# Override for the actual reverse proxy subnet when deploying outside Docker.
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1|::1}
