# Paste inside the mp-admin site's existing server {} in 1Panel.
# Keep its root, server_name, listen, certificate paths and 1Panel includes.
# Replace an existing location / instead of defining it twice.
# If client_max_body_size already exists in that server, change it to 6m there.
client_max_body_size 6m;

location = /api { return 404; }
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_cache off;
}
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_cache off;
}
location = /actuator { return 404; }
location ^~ /actuator/ { return 404; }
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ^~ /media/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
}
location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
location / {
    try_files $uri $uri/ /index.html;
}
