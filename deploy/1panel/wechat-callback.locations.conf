# Callback-only site: booking.hetuonian.cn.
# Paste inside this NEW site's existing server {} in 1Panel.
# Keep server_name, listen, root, certificate paths and 1Panel includes.
# Replace its existing location /; do not paste into the admin or API site.
# OpenResty uses host networking; Java stays on host loopback port 8790.
location = /api/wechat/customer-service {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_cache off;
}
location / {
    return 404;
}
