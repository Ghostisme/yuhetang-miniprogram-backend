# Paste inside the booking site's existing server {} in 1Panel.
# Create a STATIC site as an empty configuration container; proxy only the
# API, uploaded files and built-in media below. Java does not serve admin HTML.
# Keep root, server_name, listen, certificate paths and 1Panel includes.
# Replace an existing location /; do not add a second copy.
# If client_max_body_size already exists in that server, change it to 12m there.
client_max_body_size 12m;

location = /api { return 404; }
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_cache off;
}
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
location ^~ /media/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=3600";
}
location = /actuator { return 404; }
location ^~ /actuator/ { return 404; }
location / { return 404; }
