worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 16384; multi_accept on; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    keepalive_requests 100;
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 20s;
    client_max_body_size 6m;
    include /etc/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public:20m max_size=300m inactive=10m;
    upstream reservation {
        server api:8790;
        keepalive 64;
    }
    server {
        listen 8080;
        server_tokens off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Do not trust user-supplied forwarding headers; terminate HTTPS at a configured cloud LB.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 25s;
        proxy_send_timeout 20s;
        proxy_next_upstream off;
        add_header X-Content-Type-Options nosniff always;
        location /actuator { return 404; }
        location = /api/admin/login {
            limit_req zone=login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://reservation;
        }
        location = /api/site {
            proxy_cache public;
            proxy_cache_key "$scheme$host$uri";
            proxy_cache_valid 200 3s;
            proxy_cache_lock on;
            proxy_pass http://reservation;
        }
        location ~ ^/(assets|media)/ {
            proxy_cache public;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_valid 200 10m;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=3600";
            proxy_pass http://reservation;
        }
        location / {
            proxy_pass http://reservation;
        }
    }
}
